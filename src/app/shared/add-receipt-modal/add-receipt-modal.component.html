<div class="modal-overlay" (click)="close.emit()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ isEditMode ? 'Editar recibo' : 'Agregar recibo' }}</h3>
      <button class="btn btn-text" (click)="close.emit()" aria-label="Cerrar">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-row">
        <div class="form-group">
          <label for="date">Fecha</label>
          <input id="date" type="date" formControlName="date" />
          @if (form.controls.date.invalid && form.controls.date.touched) {
            <span class="field-error">La fecha es obligatoria.</span>
          }
        </div>

        <div class="form-group">
          <label for="amount">Monto</label>
          <input id="amount" type="number" step="0.01" min="0" formControlName="amount" />
          @if (form.controls.amount.invalid && form.controls.amount.touched) {
            <span class="field-error">Ingresá un monto válido.</span>
          }
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="paymentMethod">Método de pago</label>
          <select id="paymentMethod" formControlName="paymentMethod">
            @for (method of paymentMethods; track method.value) {
              <option [value]="method.value">{{ method.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label for="status">Estado</label>
          <select id="status" formControlName="status">
            @for (statusOption of statuses; track statusOption.value) {
              <option [value]="statusOption.value">{{ statusOption.label }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-group form-group-checkbox">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="sent" />
          Enviado
        </label>
      </div>

      <div class="form-group">
        <label for="notes">Notas (opcional)</label>
        <textarea id="notes" formControlName="notes" placeholder="Notas adicionales"></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="close.emit()">Cancelar</button>
        <button type="submit" class="btn btn-primary">{{ isEditMode ? 'Guardar cambios' : 'Agregar recibo' }}</button>
      </div>
    </form>
  </div>
</div>
