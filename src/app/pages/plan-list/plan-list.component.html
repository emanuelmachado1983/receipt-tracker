<div class="container">
  <div class="page-header">
    <div>
      <h1>Planes</h1>
      <p class="text-muted">Gestioná todos tus planes de pago.</p>
    </div>
    <button class="btn btn-primary" (click)="openCreate()">+ Nuevo plan</button>
  </div>

  <div class="toolbar">
    <input
      type="search"
      placeholder="Buscar por nombre de plan o deudor..."
      [value]="searchTerm()"
      (input)="onSearchChange($any($event.target).value)"
    />

    <div class="filter-group">
      @for (filter of filters; track filter.value) {
        <button
          class="filter-chip"
          [class.filter-chip-active]="statusFilter() === filter.value"
          (click)="statusFilter.set(filter.value)"
        >
          {{ filter.label }}
        </button>
      }
    </div>
  </div>

  @if (plans().length) {
    <div class="plan-grid">
      @for (plan of plans(); track plan.id) {
        <app-plan-card
          [plan]="plan"
          [showActions]="true"
          (edit)="openEdit(plan)"
          (remove)="confirmDelete(plan.id)"
        />
      }
    </div>
  } @else {
    <div class="empty-state card">
      <p>No hay planes que coincidan con la búsqueda o el filtro seleccionado.</p>
    </div>
  }
</div>

@if (showAddModal()) {
  <app-add-plan-modal [plan]="editingPlan()" (save)="savePlan($event)" (close)="closeModal()" />
}

@if (deletingPlanId()) {
  <app-confirm-dialog
    title="Eliminar plan"
    message="Se eliminará el plan y todos sus recibos asociados. Esta acción no se puede deshacer."
    confirmLabel="Eliminar"
    cancelLabel="Cancelar"
    (confirmed)="deletePlan()"
    (cancelled)="deletingPlanId.set(null)"
  />
}
